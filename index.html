<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zafiro Boat — Excursiones privadas en barco · Port de Pollença, Mallorca</title>
<meta name="description" content="Excursiones privadas en barco por la costa norte de Mallorca. Medio día, día completo y sunset desde el Puerto de Pollença. Todo incluido: paddle surf, kayaks y patrón profesional.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d2438'/%3E%3Cpath d='M16 6l3 6h-6z' fill='%23c9a668'/%3E%3Crect x='15' y='11' width='2' height='9' fill='%23c9a668'/%3E%3Cpath d='M8 20h16l-3 5H11z' fill='%23c9a668'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d2438;
    --navy-deep: #0a1c2c;
    --gold: #c9a668;
    --gold-light: #e0c088;
    --bg: #ffffff;
    --bg-alt: #f6f5f1;
    --ink: #15222c;
    --ink-soft: #45525c;
    --muted: #7b8590;
    --line: #e7e3d9;
    --display: 'Jost', ui-sans-serif, system-ui, sans-serif;
    --sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); font-family: var(--sans); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: var(--gold); text-decoration: none; }
  a:hover { color: var(--gold-light); }
  ::selection { background: var(--gold); color: var(--navy); }
  img { max-width: 100%; display: block; }
  [hidden] { display: none !important; }

  /* ---- reusable ---- */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; }
  .eyebrow { color: var(--gold); font-family: var(--display); font-size: 12px; letter-spacing: 3.5px; text-transform: uppercase; font-weight: 500; }
  .h-sec { font-family: var(--display); font-size: clamp(30px, 4vw, 46px); font-weight: 400; line-height: 1.1; margin: 14px 0 0; letter-spacing: 0.5px; }
  .lead { font-size: 17px; line-height: 1.8; color: var(--ink-soft); font-weight: 300; }
  .section { padding: clamp(72px, 9vw, 130px) 0; }
  .center { text-align: center; }
  .center-head { max-width: 640px; margin: 0 auto clamp(48px, 6vw, 72px); }

  .btn {
    cursor: pointer; display: inline-block; font-family: var(--display); font-size: 12.5px;
    letter-spacing: 2px; text-transform: uppercase; font-weight: 500; padding: 15px 34px;
    border-radius: 100px; border: 1px solid transparent; transition: transform .25s ease, box-shadow .25s ease, background .25s ease, color .25s ease; text-align: center;
  }
  .btn-gold { background: var(--gold); color: var(--navy); }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(201,166,104,0.4); color: var(--navy); }
  .btn-outline { background: transparent; border-color: rgba(255,255,255,0.55); color: #fff; }
  .btn-outline:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .btn-dark { background: var(--navy); color: #fff; }
  .btn-dark:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(13,36,56,0.28); color: #fff; }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn-ghost:hover { border-color: var(--gold); color: var(--ink); }

  /* ---- NAV ---- */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 40px; transition: background .35s ease, padding .35s ease, box-shadow .35s ease;
  }
  .nav.solid { background: rgba(255,255,255,0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 1px 0 var(--line); padding: 14px 40px; }
  .brand { cursor: pointer; font-family: var(--display); font-size: 24px; font-weight: 600; letter-spacing: 5px; color: #fff; transition: color .35s ease; }
  .nav.solid .brand { color: var(--navy); }
  .nav-right { display: flex; align-items: center; gap: 30px; }
  .nav-links { display: flex; gap: 28px; }
  .nav-link {
    cursor: pointer; font-family: var(--sans); font-size: 13.5px; letter-spacing: 0.6px; font-weight: 400;
    color: rgba(255,255,255,0.82); background: none; border: none; padding: 4px 0; position: relative; transition: color .3s ease;
  }
  .nav-link::after { content: ""; position: absolute; left: 0; bottom: -2px; height: 1.5px; width: 0; background: var(--gold); transition: width .3s ease; }
  .nav-link:hover::after, .nav-link.active::after { width: 100%; }
  .nav.solid .nav-link { color: var(--ink-soft); }
  .nav.solid .nav-link:hover, .nav.solid .nav-link.active { color: var(--navy); }
  .lang { display: flex; gap: 5px; align-items: center; }
  .lang button { cursor: pointer; font-family: var(--display); font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,0.7); background: none; border: none; padding: 2px 3px; font-weight: 400; }
  .lang button.active { color: var(--gold); font-weight: 600; }
  .lang .sep { color: rgba(255,255,255,0.35); font-size: 11px; }
  .nav.solid .lang button { color: var(--muted); }
  .nav.solid .lang button.active { color: var(--gold); }
  .nav.solid .lang .sep { color: var(--line); }
  .nav .btn { padding: 11px 24px; font-size: 11.5px; }
  .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 6px; z-index: 101; }
  .nav-toggle span { display: block; width: 24px; height: 2px; background: #fff; margin: 5px 0; transition: .3s; }
  .nav.solid .nav-toggle span { background: var(--navy); }

  /* ---- HERO ---- */
  .hero { position: relative; height: 100vh; min-height: 620px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--navy); }
  .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,28,44,0.55) 0%, rgba(10,28,44,0.25) 40%, rgba(10,28,44,0.7) 100%); }
  .hero-inner { position: relative; z-index: 2; text-align: center; color: #fff; padding: 0 24px; }
  .hero-inner .eyebrow { color: var(--gold-light); }
  .hero-title { font-family: var(--display); font-weight: 500; font-size: clamp(68px, 15vw, 168px); letter-spacing: clamp(8px, 2vw, 22px); line-height: 0.95; margin: 18px 0 0; text-indent: clamp(8px, 2vw, 22px); }
  .hero-rule { width: 66px; height: 2px; background: var(--gold); margin: 26px auto; }
  .hero-sub { font-size: clamp(16px, 2vw, 20px); font-weight: 300; color: #eef1f3; max-width: 560px; margin: 0 auto; line-height: 1.6; }
  .hero-ctas { display: flex; gap: 14px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
  .scroll-hint { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 2; color: rgba(255,255,255,0.7); font-family: var(--display); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .scroll-hint .line { width: 1px; height: 34px; background: linear-gradient(var(--gold), transparent); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

  /* ---- SPLIT (image + text) ---- */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(40px, 6vw, 90px); align-items: center; }
  .split.reverse .split-media { order: 2; }
  .split-media { position: relative; }
  .split-media img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; aspect-ratio: 4 / 5; }
  .split-media .badge { position: absolute; bottom: 22px; left: 22px; background: var(--navy); color: #fff; font-family: var(--display); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; padding: 12px 18px; }
  .split-media .badge b { color: var(--gold); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 34px; margin-top: 42px; }
  .stat-value { font-family: var(--display); font-size: 30px; font-weight: 500; color: var(--navy); }
  .stat-label { font-size: 13px; color: var(--muted); letter-spacing: 0.4px; margin-top: 3px; }

  /* ---- ONBOARD ---- */
  .onboard { background: var(--navy); color: #fff; }
  .onboard .eyebrow { color: var(--gold); }
  .onboard .h-sec { color: #fff; }
  .onboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); }
  .ob-item { background: var(--navy); padding: 42px 28px; text-align: center; transition: background .3s ease; }
  .ob-item:hover { background: #10293f; }
  .ob-letter { width: 54px; height: 54px; border: 1px solid rgba(201,166,104,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-family: var(--display); font-size: 20px; color: var(--gold); }
  .ob-item .t { font-size: 15px; letter-spacing: 0.5px; color: #eef1f3; }

  /* ---- EXCURSIONS ---- */
  .exc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .exc-card { background: #fff; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; transition: transform .3s ease, box-shadow .3s ease; }
  .exc-card:hover { transform: translateY(-6px); box-shadow: 0 20px 48px rgba(13,36,56,0.14); }
  .exc-card .media { position: relative; height: 230px; overflow: hidden; }
  .exc-card .media img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
  .exc-card:hover .media img { transform: scale(1.05); }
  .exc-card .media .dur { position: absolute; top: 16px; left: 16px; background: rgba(13,36,56,0.85); color: #fff; font-family: var(--display); font-size: 11px; letter-spacing: 1.5px; padding: 7px 13px; text-transform: uppercase; }
  .exc-body { padding: 28px 26px 30px; display: flex; flex-direction: column; flex: 1; }
  .exc-name { font-family: var(--display); font-size: 26px; font-weight: 500; }
  .exc-desc { font-size: 14.5px; color: var(--ink-soft); line-height: 1.7; margin-top: 10px; font-weight: 300; }
  .exc-inc { list-style: none; padding: 0; margin: 20px 0 0; display: flex; flex-direction: column; gap: 9px; }
  .exc-inc li { font-size: 13.5px; color: var(--ink-soft); display: flex; gap: 10px; align-items: flex-start; }
  .exc-inc li::before { content: "—"; color: var(--gold); }
  .exc-foot { margin-top: auto; padding-top: 24px; }
  .exc-price-row { display: flex; align-items: baseline; gap: 8px; padding-top: 20px; border-top: 1px solid var(--line); }
  .exc-price { font-family: var(--display); font-size: 25px; font-weight: 500; color: var(--navy); }
  .exc-price-note { font-size: 12px; color: var(--muted); }
  .exc-card .btn { margin-top: 18px; width: 100%; }
  .exc-extras { margin-top: clamp(48px, 6vw, 72px); display: grid; grid-template-columns: 1fr 1fr; gap: clamp(36px, 5vw, 64px); }
  .exc-extras h3 { font-family: var(--display); font-size: 22px; font-weight: 500; margin: 0 0 20px; }
  .extras-list, .notes-list { display: flex; flex-direction: column; gap: 13px; }
  .extras-list .x { font-size: 15px; color: var(--ink-soft); display: flex; gap: 12px; align-items: center; }
  .extras-list .x .d { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
  .notes-list .n { font-size: 14.5px; color: var(--ink-soft); line-height: 1.65; font-weight: 300; }

  /* ---- FULL-BLEED BAND ---- */
  .band { position: relative; height: 62vh; min-height: 380px; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; background: var(--navy); }
  .band img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .band .overlay { position: absolute; inset: 0; background: rgba(10,28,44,0.5); }
  .band .band-inner { position: relative; z-index: 2; color: #fff; padding: 0 24px; }
  .band .h-sec { color: #fff; max-width: 760px; }

  /* ---- REVIEWS ---- */
  .reviews { background: var(--bg-alt); }
  .reviews-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .review { background: #fff; padding: 34px 32px; border-radius: 4px; border-top: 3px solid var(--gold); box-shadow: 0 8px 30px rgba(13,36,56,0.06); }
  .review .stars { color: var(--gold); letter-spacing: 3px; font-size: 15px; }
  .review .q { font-size: 15.5px; line-height: 1.75; color: var(--ink-soft); margin-top: 16px; font-weight: 300; }
  .review .who { font-family: var(--display); font-size: 13px; letter-spacing: 0.6px; color: var(--navy); margin-top: 18px; }

  /* ---- LOCATION ---- */
  .loc { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: clamp(40px, 5vw, 72px); align-items: center; }
  .loc-map { border-radius: 4px; overflow: hidden; height: 420px; border: 1px solid var(--line); }
  .loc-map iframe { width: 100%; height: 100%; border: 0; filter: grayscale(0.25); }

  /* ---- CTA BANNER ---- */
  .cta { background: var(--navy); color: #fff; text-align: center; }
  .cta .h-sec { color: #fff; }
  .cta .lead { color: #cdd6dd; max-width: 560px; margin: 16px auto 0; }
  .cta .btn { margin-top: 34px; }

  /* ---- CONTACT ---- */
  .page-head { position: relative; height: 300px; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; background: var(--navy); }
  .page-head img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .page-head .overlay { position: absolute; inset: 0; background: rgba(10,28,44,0.6); }
  .page-head .ph-inner { position: relative; z-index: 2; color: #fff; }
  .page-head .title { font-family: var(--display); font-size: clamp(34px, 6vw, 52px); font-weight: 500; margin-top: 12px; }
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(40px, 5vw, 72px); }
  .contact-grid h3 { font-family: var(--display); font-size: 22px; font-weight: 500; margin: 0 0 26px; }
  .contact-info { display: flex; flex-direction: column; gap: 22px; }
  .ci-label { font-family: var(--display); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); }
  .ci-value { font-size: 16.5px; margin-top: 5px; line-height: 1.6; color: var(--ink); }
  .contact-map { margin-top: 30px; height: 240px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .contact-map iframe { width: 100%; height: 100%; border: 0; filter: grayscale(0.25); }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-family: var(--display); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .field input, .field textarea { width: 100%; padding: 13px 15px; border: 1px solid var(--line); border-radius: 3px; background: #fff; font-family: var(--sans); font-size: 15px; color: var(--ink); transition: border-color .2s ease; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
  .form-status { display: none; padding: 13px 16px; font-size: 14px; line-height: 1.5; margin: 6px 0 14px; border-radius: 3px; }
  .form-status.ok { display: block; background: rgba(201,166,104,0.14); color: #7a5f2a; border: 1px solid rgba(201,166,104,0.4); }
  .form-status.err { display: block; background: rgba(179,69,44,0.09); color: #b3452c; border: 1px solid rgba(179,69,44,0.3); }

  /* ---- FOOTER ---- */
  .footer { background: var(--navy-deep); color: #fff; padding: 56px 40px 34px; text-align: center; }
  .footer .fbrand { font-family: var(--display); font-size: 22px; letter-spacing: 5px; }
  .footer .fline { color: #93a0ab; font-size: 13.5px; margin-top: 14px; }
  .footer .fline a { color: #cdd6dd; }
  .footer .fcopy { color: #5f6d78; font-size: 12px; margin-top: 20px; }

  /* ---- RESPONSIVE ---- */
  @media (max-width: 900px) {
    .wrap { padding: 0 22px; }
    .nav { padding: 16px 22px; }
    .nav.solid { padding: 12px 22px; }
    .nav-links, .lang { display: none; }
    .nav.open .nav-links { display: flex; flex-direction: column; gap: 22px; position: absolute; top: 100%; left: 0; right: 0; background: var(--navy); padding: 28px 22px; }
    .nav.open .nav-link { color: #fff; font-size: 16px; }
    .nav.open .lang { display: flex; position: absolute; top: 100%; left: 0; right: 0; margin-top: 210px; padding: 0 22px 24px; background: var(--navy); justify-content: center; }
    .nav.open .lang button { color: rgba(255,255,255,0.8); }
    .nav.open .lang button.active { color: var(--gold); }
    .nav-toggle { display: block; }
    .nav-right { gap: 14px; }
    .split, .split.reverse .split-media { grid-template-columns: 1fr; }
    .split.reverse .split-media { order: 0; }
    .split-media img { aspect-ratio: 16 / 11; }
    .onboard-grid { grid-template-columns: 1fr 1fr; }
    .exc-grid, .reviews-grid { grid-template-columns: 1fr; }
    .exc-extras, .loc, .contact-grid { grid-template-columns: 1fr; }
    .loc-map { height: 320px; }
    .stats { gap: 22px; }
  }
  @media (max-width: 520px) {
    .onboard-grid { grid-template-columns: 1fr; }
    .hero-ctas .btn { width: 100%; }
  }
</style>
</head>
<body>

<!-- ================= NAV ================= -->
<div class="nav" id="nav">
  <div class="brand" onclick="goSection('top')">ZAFIRO</div>
  <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
  <div class="nav-right">
    <div class="nav-links">
      <button class="nav-link" data-sec="top" data-t="nav.inicio" onclick="goSection('top')"></button>
      <button class="nav-link" data-sec="barco" data-t="nav.barco" onclick="goSection('barco')"></button>
      <button class="nav-link" data-sec="excursiones" data-t="nav.excursiones" onclick="goSection('excursiones')"></button>
      <button class="nav-link" data-sec="opiniones" data-t="nav.opiniones" onclick="goSection('opiniones')"></button>
      <button class="nav-link" data-view="contacto" data-t="nav.contacto" onclick="go('contacto')"></button>
    </div>
    <div class="lang">
      <button data-lang="es" onclick="setLang('es')">ES</button><span class="sep">/</span>
      <button data-lang="en" onclick="setLang('en')">EN</button><span class="sep">/</span>
      <button data-lang="de" onclick="setLang('de')">DE</button>
    </div>
    <button class="btn btn-gold" data-t="nav.cta" onclick="go('contacto')"></button>
  </div>
</div>

<!-- ================= HOME ================= -->
<main id="view-home">

  <!-- HERO -->
  <section class="hero" id="sec-top">
    <video autoplay muted loop playsinline preload="auto" poster="assets/hero-poster.jpg">
      <source src="assets/hero.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-inner">
      <div class="eyebrow" data-t="home.heroTag"></div>
      <h1 class="hero-title">ZAFIRO</h1>
      <div class="hero-rule"></div>
      <p class="hero-sub" data-t="home.heroSubtitle"></p>
      <div class="hero-ctas">
        <button class="btn btn-gold" data-t="home.heroCta1" onclick="go('contacto')"></button>
        <button class="btn btn-outline" data-t="home.heroCta2" onclick="goSection('excursiones')"></button>
      </div>
    </div>
    <div class="scroll-hint"><span data-t="home.scroll"></span><span class="line"></span></div>
  </section>

  <!-- EL BARCO -->
  <section class="section" id="sec-barco">
    <div class="wrap split">
      <div class="split-media">
        <img src="assets/img/barco.jpg" alt="Cubierta de teca del Zafiro sobre agua turquesa" loading="lazy">
        <div class="badge" data-t="home.boatBadge"></div>
      </div>
      <div>
        <div class="eyebrow" data-t="home.aboutTag"></div>
        <h2 class="h-sec" data-t="home.aboutTitle"></h2>
        <p class="lead" data-t="home.aboutBody" style="margin-top:22px"></p>
        <div class="stats" id="home-stats"></div>
      </div>
    </div>
  </section>

  <!-- A BORDO -->
  <section class="section onboard">
    <div class="wrap">
      <div class="center-head center">
        <div class="eyebrow" data-t="home.onboardTag"></div>
        <h2 class="h-sec" data-t="home.onboardTitle"></h2>
      </div>
      <div class="onboard-grid" id="home-onboard"></div>
    </div>
  </section>

  <!-- EXCURSIONES -->
  <section class="section" id="sec-excursiones">
    <div class="wrap">
      <div class="center-head center">
        <div class="eyebrow" data-t="exc.pageTag"></div>
        <h2 class="h-sec" data-t="exc.pageTitle"></h2>
        <p class="lead" data-t="exc.pageSubtitle" style="margin-top:16px"></p>
      </div>
      <div class="exc-grid" id="home-exc"></div>
      <div class="exc-extras">
        <div>
          <h3 data-t="exc.extrasTitle"></h3>
          <div class="extras-list" id="exc-extras"></div>
        </div>
        <div>
          <h3 data-t="exc.notesTitle"></h3>
          <div class="notes-list" id="exc-notes"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- BAND -->
  <section class="band">
    <img src="assets/img/costa.jpg" alt="Vista aérea del Zafiro navegando" loading="lazy">
    <div class="overlay"></div>
    <div class="band-inner">
      <div class="eyebrow" style="color:var(--gold-light)" data-t="home.bandTag"></div>
      <h2 class="h-sec" data-t="home.bandTitle"></h2>

var lang = 'es', view = 'home';

function T(path) { var o = I18N[lang]; path.split('.').forEach(function (k) { o = o && o[k]; }); return o == null ? '' : o; }
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ---------- vistas y navegación ---------- */
function go(v) {
  view = v;
  document.getElementById('view-home').hidden = v !== 'home';
  document.getElementById('view-contacto').hidden = v !== 'contacto';
  document.querySelectorAll('.nav-link').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-view') === v);
  });
  document.getElementById('nav').classList.remove('open');
  if (history.replaceState) history.replaceState(null, '', v === 'home' ? location.pathname : '#contacto');
  window.scrollTo(0, 0);
  onScroll();
}
function goSection(id) {
  if (view !== 'home') { go('home'); }
  document.getElementById('nav').classList.remove('open');
  requestAnimationFrame(function () {
    if (id === 'top') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    var target = document.getElementById('sec-' + id);
    if (target) { var y = target.getBoundingClientRect().top + window.pageYOffset - 64; window.scrollTo({ top: y, behavior: 'smooth' }); }
  });
}
function goReserva(excName) {
  go('contacto');
  var ta = document.querySelector('#contact-form [name=mensaje]');
  if (ta && excName) { ta.value = T('contact.prefill').replace('{x}', excName); ta.focus(); }
}

/* ---------- idioma ---------- */
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('.lang button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === l); });
  applyText();
  renderHome();
  renderExcursions();
  renderContactBtn();
  try { localStorage.setItem('zafiro_lang', l); } catch (e) {}
}
function applyText() {
  document.querySelectorAll('[data-t]').forEach(function (node) {
    var v = T(node.getAttribute('data-t'));
    if (node.getAttribute('data-t') === 'home.boatBadge') node.innerHTML = v; else node.textContent = v;
  });
}

/* ---------- HOME dinámico ---------- */
function renderHome() {
  var h = I18N[lang].home;
  var stats = document.getElementById('home-stats'); stats.innerHTML = '';
  h.aboutStats.forEach(function (s) { var d = el('div'); d.appendChild(el('div', 'stat-value', s.value)); d.appendChild(el('div', 'stat-label', s.label)); stats.appendChild(d); });
  var ob = document.getElementById('home-onboard'); ob.innerHTML = '';
  h.onboardItems.forEach(function (it) { var d = el('div', 'ob-item'); d.appendChild(el('div', 'ob-letter', it.letter)); d.appendChild(el('div', 't', it.title)); ob.appendChild(d); });
  var rev = document.getElementById('home-reviews'); rev.innerHTML = '';
  h.reviews.forEach(function (r) { var d = el('div', 'review'); d.innerHTML = '<div class="stars">★★★★★</div><div class="q">' + esc(r.quote) + '</div><div class="who">' + esc(r.name) + '</div>'; rev.appendChild(d); });
}

/* ---------- EXCURSIONES dinámico ---------- */
function renderExcursions() {
  var e = I18N[lang].exc;
  var grid = document.getElementById('home-exc'); grid.innerHTML = '';
  e.cards.forEach(function (c) {
    var inc = c.includes.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('');
    var card = el('div', 'exc-card');
    card.innerHTML =
      '<div class="media"><img src="' + esc(c.img) + '" alt="' + esc(c.name) + '" loading="lazy"><div class="dur">' + esc(c.duration) + '</div></div>' +
      '<div class="exc-body">' +
        '<div class="exc-name">' + esc(c.name) + '</div>' +
        '<div class="exc-desc">' + esc(c.desc) + '</div>' +
        '<ul class="exc-inc">' + inc + '</ul>' +
        '<div class="exc-foot">' +
          '<div class="exc-price-row"><div class="exc-price">' + esc(c.price) + '</div><div class="exc-price-note">' + esc(c.priceNote) + '</div></div>' +
          '<button class="btn btn-gold">' + esc(e.reserveBtn) + '</button>' +
        '</div>' +
      '</div>';
    card.querySelector('button').onclick = function () { goReserva(c.name); };
    grid.appendChild(card);
  });
  var ex = document.getElementById('exc-extras'); ex.innerHTML = '';
  e.extras.forEach(function (x) { var d = el('div', 'x'); d.innerHTML = '<div class="d"></div>' + esc(x); ex.appendChild(d); });
  var no = document.getElementById('exc-notes'); no.innerHTML = '';
  e.notes.forEach(function (n) { no.appendChild(el('div', 'n', n)); });
}

  var form = document.getElementById('contact-form');
  var status = document.getElementById('contact-status');
  var btn = document.getElementById('contact-btn');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var nombre = form.nombre.value.trim();
    var email = form.email.value.trim();
    status.className = 'form-status';
    if (nombre.length < 2 || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      status.className = 'form-status err'; status.textContent = I18N[lang].contact.validation; return;
    }
    btn.disabled = true;
    var data = new FormData(form);
    data.append('_subject', 'Nueva solicitud web — Zafiro Boat');
    data.append('_template', 'table');
    data.append('_captcha', 'false');
    fetch(FORM_ENDPOINT, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } })
      .then(function (res) {
        btn.disabled = false;
        if (res.ok) { form.reset(); btn.dataset.sent = '1'; btn.textContent = I18N[lang].contact.sent; setTimeout(function () { delete btn.dataset.sent; btn.textContent = I18N[lang].contact.send; }, 4000); }
        else { status.className = 'form-status err'; status.textContent = I18N[lang].contact.sendError; }
      })
      .catch(function () { btn.disabled = false; status.className = 'form-status err'; status.textContent = I18N[lang].contact.sendError; });
  });
})();

/* ---------- nav scroll + scrollspy ---------- */
function onScroll() {
  var nav = document.getElementById('nav');
  if (view !== 'home') { nav.classList.add('solid'); return; }
  nav.classList.toggle('solid', window.pageYOffset > window.innerHeight - 90);
}
window.addEventListener('scroll', onScroll, { passive: true });

var spy = new IntersectionObserver(function (entries) {
  if (view !== 'home') return;
  entries.forEach(function (en) {
    if (en.isIntersecting) {
      var id = en.target.id.replace('sec-', '');
      document.querySelectorAll('.nav-link').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-sec') === id); });
    }
  });
}, { rootMargin: '-45% 0px -50% 0px' });
['sec-top', 'sec-barco', 'sec-excursiones', 'sec-opiniones'].forEach(function (id) { var e = document.getElementById(id); if (e) spy.observe(e); });

document.getElementById('navToggle').addEventListener('click', function () { document.getElementById('nav').classList.toggle('open'); });

/* ---------- init ---------- */
(function init() {
  var saved = null; try { saved = localStorage.getItem('zafiro_lang'); } catch (e) {}
  setLang(saved && I18N[saved] ? saved : 'es');
  if (location.hash.replace('#', '') === 'contacto') go('contacto'); else go('home');
  onScroll();
})();
</script>
</body>

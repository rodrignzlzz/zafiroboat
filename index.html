};

var lang = 'es', view = 'home';
var TOUR_PAGES = ['tour-medio-dia.html', 'tour-dia-completo.html', 'tour-sunset.html'];

function T(path) { var o = I18N[lang]; path.split('.').forEach(function (k) { o = o && o[k]; }); return o == null ? '' : o; }
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ---------- vistas y navegación ---------- */
function go(v) {
  view = v;
  document.getElementById('view-home').hidden = v !== 'home';
  document.getElementById('view-contacto').hidden = v !== 'contacto';
  document.querySelectorAll('.nav-link').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-view') === v);
  });
  document.getElementById('nav').classList.remove('open');
  if (history.replaceState) history.replaceState(null, '', v === 'home' ? location.pathname : '#contacto');
  window.scrollTo(0, 0);
  onScroll();
}
function goSection(id) {
  if (view !== 'home') { go('home'); }
  document.getElementById('nav').classList.remove('open');
  requestAnimationFrame(function () {
    if (id === 'top') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    var target = document.getElementById('sec-' + id);
    if (target) { var y = target.getBoundingClientRect().top + window.pageYOffset - 64; window.scrollTo({ top: y, behavior: 'smooth' }); }
  });
}
function goReserva(excName) {
  go('contacto');
  var ta = document.querySelector('#contact-form [name=mensaje]');
  if (ta && excName) { ta.value = T('contact.prefill').replace('{x}', excName); ta.focus(); }
}

/* ---------- idioma ---------- */
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === l); });
  applyText();
  renderHome();
  renderExcursions();
  renderContactBtn();
  try { localStorage.setItem('zafiro_lang', l); } catch (e) {}
}
function applyText() {
  document.querySelectorAll('[data-t]').forEach(function (node) {
    var v = T(node.getAttribute('data-t'));
    if (node.getAttribute('data-t') === 'home.boatBadge') node.innerHTML = v; else node.textContent = v;
  });
}

/* ---------- HOME dinámico ---------- */
function renderHome() {
  var h = I18N[lang].home;
  var stats = document.getElementById('home-stats'); stats.innerHTML = '';
  h.aboutStats.forEach(function (s) { var d = el('div'); d.appendChild(el('div', 'stat-value', s.value)); d.appendChild(el('div', 'stat-label', s.label)); stats.appendChild(d); });
  var ob = document.getElementById('home-onboard'); ob.innerHTML = '';
  h.onboardItems.forEach(function (it, i) {
    var d = el('div', 'ob-item');
    var ic = el('div', 'ob-letter'); ic.innerHTML = ICONS[ICON_KEYS[i]] || '';
    d.appendChild(ic);
    d.appendChild(el('div', 't', it.title));
    ob.appendChild(d);
  });
  var rev = document.getElementById('home-reviews'); rev.innerHTML = '';
  h.reviews.forEach(function (r) { var d = el('div', 'review'); d.innerHTML = '<div class="stars">★★★★★</div><div class="q">' + esc(r.quote) + '</div><div class="who">' + esc(r.name) + '</div>'; rev.appendChild(d); });
}

/* ---------- EXCURSIONES dinámico ---------- */
function renderExcursions() {
  var e = I18N[lang].exc;
  var grid = document.getElementById('home-exc'); grid.innerHTML = '';
  e.cards.forEach(function (c, ci) {
    var inc = c.includes.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('');
    var card = el('div', 'exc-card');
    card.innerHTML =
      '<div class="media"><img src="' + esc(c.img) + '" alt="' + esc(c.name) + '" loading="lazy"><div class="dur">' + esc(c.duration) + '</div></div>' +
      '<div class="exc-body">' +
        '<div class="exc-name">' + esc(c.name) + '</div>' +
        '<div class="exc-desc">' + esc(c.desc) + '</div>' +
        '<ul class="exc-inc">' + inc + '</ul>' +
        '<div class="exc-foot">' +
          '<div class="exc-price-row"><div class="exc-price">' + esc(c.price) + '</div><div class="exc-price-note">' + esc(c.priceNote) + '</div></div>' +
          '<div class="exc-actions">' +
            '<a class="btn btn-ghost" href="' + TOUR_PAGES[ci] + '">' + esc(e.moreInfo) + '</a>' +
            '<button class="btn btn-gold">' + esc(e.reserveBtn) + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    card.querySelector('button').onclick = function () { goReserva(c.name); };
    grid.appendChild(card);
  });
  var ex = document.getElementById('exc-extras'); ex.innerHTML = '';
  e.extras.forEach(function (x) { var d = el('div', 'x'); d.innerHTML = '<div class="d"></div>' + esc(x); ex.appendChild(d); });
  var no = document.getElementById('exc-notes'); no.innerHTML = '';
  e.notes.forEach(function (n) { no.appendChild(el('div', 'n', n)); });
}

/* ---------- CONTACTO ---------- */
function renderContactBtn() { var btn = document.getElementById('contact-btn'); if (btn && !btn.dataset.sent) btn.textContent = I18N[lang].contact.send; }
(function () {
  var form = document.getElementById('contact-form');
  var status = document.getElementById('contact-status');
  var btn = document.getElementById('contact-btn');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var nombre = form.nombre.value.trim();
    var email = form.email.value.trim();
    status.className = 'form-status';
    if (nombre.length < 2 || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      status.className = 'form-status err'; status.textContent = I18N[lang].contact.validation; return;
    }
    btn.disabled = true;
    var data = new FormData(form);
    data.append('_subject', 'Nueva solicitud web — Zafiro Boat');
    data.append('_template', 'table');
    data.append('_captcha', 'false');
    fetch(FORM_ENDPOINT, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } })
      .then(function (res) {
        btn.disabled = false;
        if (res.ok) { form.reset(); btn.dataset.sent = '1'; btn.textContent = I18N[lang].contact.sent; setTimeout(function () { delete btn.dataset.sent; btn.textContent = I18N[lang].contact.send; }, 4000); }
        else { status.className = 'form-status err'; status.textContent = I18N[lang].contact.sendError; }
      })
      .catch(function () { btn.disabled = false; status.className = 'form-status err'; status.textContent = I18N[lang].contact.sendError; });
  });
})();

/* ---------- RESEÑAS (formulario) ---------- */
(function () {
  var stars = document.getElementById('stars-input');
  var hidden = document.getElementById('rf-rating');
  var form = document.getElementById('review-form');
  var status = document.getElementById('review-status');
  var btn = document.getElementById('review-btn');
  if (!stars || !form) return;
  var rating = 0;
  function paint(n) { [].forEach.call(stars.children, function (b, i) { b.classList.toggle('on', i < n); }); }
  [].forEach.call(stars.children, function (b) {
    b.addEventListener('click', function () { rating = +b.getAttribute('data-v'); hidden.value = rating; paint(rating); });
    b.addEventListener('mouseenter', function () { paint(+b.getAttribute('data-v')); });
  });
  stars.addEventListener('mouseleave', function () { paint(rating); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var nombre = form.nombre.value.trim();
    status.className = 'form-status';
    if (nombre.length < 2 || !rating) { status.className = 'form-status err'; status.textContent = T('home.rfValidation'); return; }
    btn.disabled = true;
    var data = new FormData(form);
    data.append('_subject', 'Nueva reseña web — Zafiro Boat');
    data.append('Estrellas', rating + '/5');
    data.append('_template', 'table'); data.append('_captcha', 'false');
    fetch(FORM_ENDPOINT, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } })
      .then(function (res) {
        btn.disabled = false;
        if (res.ok) { form.reset(); rating = 0; hidden.value = ''; paint(0); status.className = 'form-status ok'; status.textContent = T('home.rfSent'); }
        else { status.className = 'form-status err'; status.textContent = I18N[lang].contact.sendError; }
      })
      .catch(function () { btn.disabled = false; status.className = 'form-status err'; status.textContent = I18N[lang].contact.sendError; });
  });
})();

/* ---------- nav scroll + scrollspy ---------- */
function onScroll() {
  var nav = document.getElementById('nav');
  if (view !== 'home') { nav.classList.add('solid'); return; }
  nav.classList.toggle('solid', window.pageYOffset > window.innerHeight - 90);
}
window.addEventListener('scroll', onScroll, { passive: true });

var spy = new IntersectionObserver(function (entries) {
  if (view !== 'home') return;
  entries.forEach(function (en) {
    if (en.isIntersecting) {
      var id = en.target.id.replace('sec-', '');
      document.querySelectorAll('.nav-link').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-sec') === id); });
    }
  });
}, { rootMargin: '-45% 0px -50% 0px' });
['sec-top', 'sec-barco', 'sec-excursiones', 'sec-opiniones'].forEach(function (id) { var e = document.getElementById(id); if (e) spy.observe(e); });

/* ---------- GALERÍA del barco ----------
   Para añadir fotos: sube el archivo a assets/img/ y añade su ruta a esta lista. */
var BOAT_GALLERY = [
  { src: 'assets/img/navegacion.jpg' },
  { src: 'assets/img/teca.jpg' },
  { src: 'assets/img/barco.jpg', mirror: true }
];
(function () {
  var g = document.getElementById('boat-gallery');
  if (!g) return;
  var dotsWrap = document.getElementById('gal-dots');
  var prevBtn = document.getElementById('gal-prev');
  var nextBtn = document.getElementById('gal-next');
  var imgs = [], dots = [], idx = 0, timer = null;
  BOAT_GALLERY.forEach(function (item, i) {
    var im = document.createElement('img');
    im.className = 'gal-img' + (i === 0 ? ' on' : '') + (item.mirror ? ' flip' : '');
    im.src = item.src; im.alt = 'Zafiro'; im.loading = i === 0 ? 'eager' : 'lazy';
    g.appendChild(im); imgs.push(im);
    var d = document.createElement('button');
    d.className = 'gal-dot' + (i === 0 ? ' on' : ''); d.type = 'button';
    d.setAttribute('aria-label', 'Foto ' + (i + 1));
    d.addEventListener('click', function () { show(i); restart(); });
    dotsWrap.appendChild(d); dots.push(d);
  });
  function show(i) {
    idx = (i + imgs.length) % imgs.length;
    imgs.forEach(function (m, k) { m.classList.toggle('on', k === idx); });
    dots.forEach(function (m, k) { m.classList.toggle('on', k === idx); });
  }
  function next() { show(idx + 1); }
  function prev() { show(idx - 1); }
  function start() { if (imgs.length > 1) timer = setInterval(next, 5000); }
  function restart() { clearInterval(timer); start(); }
  nextBtn.addEventListener('click', function () { next(); restart(); });
  prevBtn.addEventListener('click', function () { prev(); restart(); });
  g.addEventListener('mouseenter', function () { clearInterval(timer); });
  g.addEventListener('mouseleave', start);
  var x0 = null;
  g.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  g.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) { (dx < 0 ? next : prev)(); restart(); }
    x0 = null;
  });
  if (imgs.length < 2) { prevBtn.style.display = 'none'; nextBtn.style.display = 'none'; dotsWrap.style.display = 'none'; }
  start();
})();

/* ---------- hero video autoplay (móvil) ---------- */
(function () {
  var v = document.getElementById('heroVideo');
  if (!v) return;
  v.muted = true; v.defaultMuted = true;
  v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
  function tryPlay() { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
  var events = ['touchstart', 'pointerdown', 'click', 'scroll', 'keydown'];
  function cleanup() { events.forEach(function (e) { window.removeEventListener(e, kick); }); }
  function kick() { tryPlay(); if (!v.paused) cleanup(); }
  tryPlay();
  v.addEventListener('loadeddata', tryPlay, { once: true });
  v.addEventListener('canplay', tryPlay, { once: true });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tryPlay(); });
  events.forEach(function (e) { window.addEventListener(e, kick, { passive: true }); });
})();

/* ---------- init ---------- */
(function init() {
  var saved = null; try { saved = localStorage.getItem('zafiro_lang'); } catch (e) {}
  setLang(saved && I18N[saved] ? saved : 'es');
  var h = location.hash.replace('#', '');
  if (h === 'contacto') go('contacto');
  else { go('home'); if (['barco', 'excursiones', 'opiniones'].indexOf(h) >= 0) requestAnimationFrame(function () { goSection(h); }); }
  onScroll();
})();
</script>
